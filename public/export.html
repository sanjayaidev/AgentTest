<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Export Designs — Canva Connect</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2e38; --text:#e8eaed; --muted:#9aa0ab; --accent:#7c5cff; --success:#3ecf6f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#666; display:inline-block; margin-right:8px; }
  .status.connected .dot { background:#3ecf6f; }
  .status.off .dot { background:#e5484d; }
  button, a.btn { background: var(--accent); color:#fff; border:none; padding:10px 16px; border-radius:8px; font-size:14px; cursor:pointer; text-decoration:none; display:inline-block; }
  button:disabled { opacity:.5; cursor:default; }
  button.secondary, a.btn.secondary { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button.success { background: var(--success); }
  input, select { width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:#0f1115; color:var(--text); margin-bottom:10px; font-size:14px; }
  label { font-size:12px; color:var(--muted); display:block; margin-bottom:4px; }
  .result { margin-top:14px; padding:12px; background:#0f1115; border:1px solid var(--line); border-radius:8px; font-size:13px; word-break: break-all; }
  .result a { color: var(--accent); }
  .error { color:#e5484d; font-size:13px; margin-top:8px; }
  
  /* Design list styles */
  .design-list { margin-top: 16px; }
  .design-item { display: block; padding: 16px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; background: #0f1115; transition: all 0.2s ease; }
  .design-item:hover { border-color: var(--accent); }
  .design-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .design-item input[type="checkbox"] { width: auto; margin-right: 0; accent-color: var(--accent); transform: scale(1.2); }
  .design-thumbnail { width: 160px; height: auto; object-fit: contain; border-radius: 8px; background: #0f1115; flex-shrink: 0; aspect-ratio: 16/9; }
  .design-thumbnail-placeholder { width: 160px; height: 90px; display: flex; align-items: center; justify-content: center; background: #1a1e26; border-radius: 8px; color: var(--muted); font-size: 11px; flex-shrink: 0; }
  .design-info { flex: 1; min-width: 0; }
  .design-title { font-weight: 500; font-size: 15px; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .design-meta { font-size: 12px; color: var(--muted); }
  .design-type { display: inline-block; padding: 2px 8px; background: var(--line); border-radius: 4px; font-size: 11px; margin-left: 8px; }
  
  /* Slides container */
  .slides-container { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .slides-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .slides-title { font-size: 13px; color: var(--muted); font-weight: 500; }
  .slide-toggle-btn { background: transparent; border: 1px solid var(--line); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .slide-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
  .slides-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .slide-item { background: #0f1115; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; transition: all 0.2s; }
  .slide-item:hover { border-color: var(--accent); transform: translateY(-2px); }
  .slide-thumbnail { width: 100%; height: auto; object-fit: contain; display: block; background: #0f1115; }
  .slide-thumbnail-placeholder { width: 100%; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; background: #1a1e26; color: var(--muted); font-size: 11px; }
  .slide-footer { padding: 10px; display: flex; align-items: center; justify-content: space-between; }
  .slide-number { font-size: 11px; color: var(--muted); }
  .slide-download-btn { background: var(--accent); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; text-decoration: none; }
  .slide-download-btn:hover { opacity: 0.9; }
  .slides-hidden .slides-grid { display: none; }
  
  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar select { width: auto; margin-bottom: 0; }
  .selected-count { color: var(--muted); font-size: 14px; }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .empty-state { text-align: center; padding: 40px; color: var(--muted); }
  .empty-state a { color: var(--accent); }
  
  .back-link { display: inline-block; margin-bottom: 20px; color: var(--muted); text-decoration: none; transition: color 0.2s; }
  .back-link:hover { color: var(--accent); }
  
  /* Fetch more button */
  .fetch-more-container { text-align: center; margin-top: 20px; }
  .fetch-more-btn { background: transparent; border: 1px solid var(--line); color: var(--text); padding: 12px 24px; font-size: 14px; }
  .fetch-more-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .fetch-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  /* Export result improvements */
  .export-success { background: #1a3d2e; border: 1px solid #3ecf6f; }
  .export-failed { background: #3d1a1a; border: 1px solid #e5484d; }
  .download-link { color: var(--accent); text-decoration: none; font-weight: 500; }
  .download-link:hover { text-decoration: underline; }
  .copy-url-btn { color: #7c5cff; background: none; border: none; cursor: pointer; padding: 0; font-size: 12px; }
  .copy-url-btn:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <a href="/" class="back-link">← Back to Home</a>
  <h1>export <span>designs</span></h1>
  <div class="sub">Select and download multiple designs from your Canva account</div>
  
  <div class="panel">
    <div class="row">
      <div class="status off" id="status"><span class="dot"></span><span id="statusText">checking…</span></div>
      <div id="connectArea">
        <a class="btn" id="connectBtn" href="/auth/canva">Connect Canva</a>
      </div>
    </div>
  </div>
  
  <div class="panel" id="exportPanel" style="display:none;">
    <div class="toolbar">
      <label style="margin:0;">Export format:</label>
      <select id="exportFormat">
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
        <option value="pdf">PDF</option>
        <option value="pptx">PPTX</option>
      </select>
      <button id="selectAllBtn" class="secondary">Select All</button>
      <button id="downloadBtn" disabled>Download Selected (<span id="selectedCount">0</span>)</button>
      <button id="downloadTxtBtn" class="secondary" disabled title="Download CDN URLs as TXT file">Download TXT</button>
      <button id="gitLfsBtn" class="secondary" title="Export to Git LFS repository">Git LFS Export</button>
      <button id="downloadAllBatBtn" class="success" title="Full-quality export for every design — slower, subject to Canva's 75-exports/5min rate limit">⬇ Download ALL (full export, rate-limited)</button>
      <button id="downloadThumbsBatBtn" class="success" title="Uses thumbnail URLs already in the design list — instant, no rate limit, preview quality">⬇ Download ALL Thumbnails (no rate limit)</button>
      <span class="selected-count" id="selectionStatus"></span>
    </div>
    
    <div id="designListContainer">
      <div class="loading">Loading designs…</div>
    </div>
    
    <div id="fetchMoreContainer" class="fetch-more-container" style="display:none;">
      <button id="fetchMoreBtn" class="fetch-more-btn">Fetch More Designs</button>
    </div>
    
    <div class="result" id="exportResult" style="display:none;"></div>
  </div>
</div>
<script src="/export-app.js"></script>
</body>
</html>
